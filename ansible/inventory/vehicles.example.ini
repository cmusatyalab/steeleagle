[vehicles]
harpy ansible_host=192.0.2.10 ansible_user=pi
# 'localhost' is included so the eagled_vehicle role can be dry-run/tested
# on the control host itself before touching real hardware.
localhost ansible_connection=local

[vehicles:vars]
eagled_install_mode=cross_compile
eagled_isolation_mode=sandbox

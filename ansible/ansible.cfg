[defaults]
inventory = inventory/dev.example.ini
roles_path = roles
# Deliberate tradeoff: provisioning a fleet of vehicles means connecting to
# many freshly-imaged devices with no pre-seeded known_hosts entries, and
# prompting for each would make unattended runs impossible. Operators with
# stricter security requirements should remove this line and manage
# known_hosts separately (e.g. seed it from the fleet inventory).
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: >-
      dev_environment only supports Debian-family targets (Debian/Ubuntu).
      Detected OS family: {{ ansible_os_family }}.
  when: ansible_os_family != 'Debian'
  tags: always

- name: Include Debian-family tasks
  ansible.builtin.include_tasks: Debian.yml
  when: ansible_os_family == 'Debian'
  tags: always

# Example config for `eagle configure`. This config gets pushed to a running
# instance over its control-plane API, which starts the vehicles it describes.
# The daemon-wide settings (everything above [[vehicles]], including hostname)
# only take effect on the first call to a given eagled instance; `eagle
# configure` prints a note if a later call's daemon-wide settings differ from
# what's already active, since those differences are silently not applied.

# Vehicle ports are assigned in ascending order from this base port.
hostname = "eagled"
vehicle-port-base = 9000
gabriel-port = 9099
swarm-controller-port = 5003
headless = true
auto-run = true
auto-install = true

[[vehicles]]
# Name of the vehicle.
name = "harpy"
[vehicles.plugin]
id = "parrot_anafi"
url = ""
tag = ""
override = ""
[vehicles.plugin.args]
runtime = "container | sandbox | process"
[vehicles.sim]
default = false
lat = 40.413664
lon = -79.949285
alt = 0
[vehicles.args]
ip = "10.202.0.1"

[[engines]]
name = "yolo_qnn"
[engines.plugin]
plugin = "yolo_qnn"
[engines.plugin.args]

[[monitors]]
name = ""
[monitors.plugin]
plugin = ""
[monitors.plugin.args]

[[extras]] # extra uncategorized services

# These are managed services, and are not exposed to the GCS for starting/stopping.
# They can be changed under an advanced settings dropdown, and trigger a daemon
# restart when they are changed.
[simulator]
[simulator.plugin]
id = "steeleagle_aviary"
[simulator.plugin.args]

[gcs]
[gcs.plugin]
id = "steeleagle_gcs"
[gcs.plugin.args]

[swarm-controller]
[swarm-controller.plugin]
plugin = "steeleagle_swarm_controller"
[swarm-controller.plugin.args]

[db]
[db.plugin]
plugin = "steeleagle_db"
[db.plugin.args]

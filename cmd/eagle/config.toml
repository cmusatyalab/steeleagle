# Example config for `eagle configure`. eagled keeps no config file on disk
# itself. This config gets pushed to a running instance over its control-plane
# API, which starts the vehicles it describes. The daemon-wide settings
# (everything above [[vehicles]]) only take effect on the first call to a given
# eagled instance.

# Vehicle ports are assigned in ascending order from this base port.
port-base = 9000

# eagled's identity: both the name its own tsnet node joins the tailnet as,
# and the name it reports to the swarm controller so it can tell which eagled
# instance a vehicle belongs to. Defaults to the OS hostname if left blank.
#
# There's no separate on/off switch for Tailscale VPN: it's used automatically
# whenever an auth key is available, and skipped otherwise. eagled joins its
# own tsnet node non-interactively using the reusable Tailscale auth key in
# $TS_AUTHKEY (issued offline and provisioned onto this host ahead of time),
# and joins every vehicle's tsnet node using $TS_VEHICLE_AUTHKEY, falling back
# to $TS_AUTHKEY if that's unset. Neither env var name is configurable. If
# $TS_AUTHKEY is unset, eagled skips starting its own tsnet node entirely
# (stays reachable over plain TCP only) rather than hanging in tsnet's
# interactive login flow, which nothing here can complete; likewise a vehicle
# gets no tsnet node of its own if no key resolves for it either.
#hostname = "-eagled"

[gabriel]
# The Gabriel flow each vehicle runs: where its frames and telemetry go, and
# which engines process them. Left without producers (as below), vehicles run
# without Gabriel.
#
# Gabriel's names are global to a machine, so in names, "{vehicle}" stands for
# the vehicle's name. A vehicle's frames are "{vehicle}.frames" and its
# telemetry "{vehicle}.telemetry". A "local" engine runs on this machine; a
# "remote" one on the remote gabriel-server below.
#
# The remote server's host:port. Gabriel connects to it over QUIC itself, not
# through a vehicle's tsnet node, so this machine's own network must reach it
# and its own DNS resolve it (or give an IP address).
remote-server = "cloudlet033:4433"
# The remote server's certificate (identity/certificate.der on the server),
# base64 encoded: base64 -w0 identity/certificate.der
# remote-certificate = ""
# How many inputs each crossing to the remote server may have in flight.
# crossing-capacity = 3
# The largest serialized frame a vehicle sends, in bytes. Defaults to 4 MiB.
# max-frame-size = 4194304
#
# For example, frames to a detector on the remote server:
#
# [[gabriel.flow.producers]]
# name = "{vehicle}.frames"
#
# [[gabriel.flow.engines]]
# name = "detector"
# location = "remote"
#
# [[gabriel.flow.edges]]
# from = "{vehicle}.frames"
# to = "detector"
# timeout = "2s"

[backend.swarm-controller]
# host:port of the swarm controller's RegistryService. Supports a MagicDNS name
# and port, e.g. "swarmcontroller:5003". Required: eagled refuses to start
# without it.
address = "cloudlet033-swarm-controller:5003"

[aviary]
# Only consulted when a Configure call lists a vehicle with simulate = true.
# Command is the command line eagled runs to launch the shared aviary
# simulator; defaults to ["uv", "run", "steeleagle-aviary"]. Dir is the working
# directory that command runs in, which is required for `uv run` to find
# aviary's virtual environment.
command = ["uv", "run", "steeleagle-aviary"]
dir = ""

# Vehicles this daemon hosts. One eagled instance can host any number of
# vehicles. Each gets its own port (ascending from port-base, in list order),
# its own tailnet identity if a vehicle auth key resolves (see above), and
# its own registration with the swarm controller.
[[vehicles]]
# Name of the vehicle.
name = "harpyeagle"
# If true, this vehicle connects to the shared aviary simulator instead of
# spawning driver. Optional lat/lon/alt (origin) may also be set here.
simulate = false
# Origin point, only used when simulate is true. Matches the default vehicle
# origin in steeleagle_plugins/aviary's own config.toml (CMU's campus).
lat = 40.413664
lon = -79.949285
alt = 0
telemetry-fps = 20

# Name of the driver plugin to run for this vehicle (installed via
# InstallPlugin under PLUGIN_CATEGORY_DRIVER), and any command line args to
# launch it with. Ignored if simulate is true.
[vehicles.driver]
name = "parrot_anafi"
#args = ["--ip", "192.168.42.1"]
args = ["--ip", "10.202.0.1"]

[vehicles.mission]
name = "mission-service"
args = ["-mission-file", "/home/ubuntu/Research/steeleagle/sdk/cmd/compiler/mission"]

# Optional per-vehicle video stream override. If omitted entirely, simulated
# vehicles default to stream-type "frames" (aviary has no RTSP source to
# forward) and every other vehicle defaults to "rtsp".
[vehicles.video]
stream-type = "frames" # "rtsp" or "frames"
fps = 20
resolution = "360p"  # "480p", "720p" (default), "1080p", or "4k"
# codec = ""           # FFmpeg hardware decode codec, e.g. "h264_cuvid"; blank for software decoding

# ==============================
# SteelEagle MCP Server Config
# ==============================

[drone]
name = "drone1"

# gRPC kernel endpoint
kernel = "unix:///tmp/test1-kernel.sock"

# Telemetry channel
telemetry = "ipc:///tmp/test1-driver_telem.sock"

# Results channel
results = "ipc:///tmp/test1-results.sock"


[compute]
# SQLite database used by MissionStore
db_path = "mcp_mission.db"


[client]
# Optional — only needed if using MCP client with Claude
anthropic_api_key = ""
model = "claude-sonnet-4-20250514"

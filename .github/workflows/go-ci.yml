name: Go CI

on:
  push:
    branches: [ "v4.0-beta" ]
    paths:
      - '.github/workflows/go-ci.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'api/go/go.mod'
      - 'api/go/go.sum'
  pull_request:
    paths:
      - '.github/workflows/go-ci.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'api/go/go.mod'
      - 'api/go/go.sum'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GABRIEL_REF: gabriel2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Check out Gabriel next to this repository
        run: git clone --depth 1 --branch "$GABRIEL_REF" https://github.com/cmusatyalab/gabriel ../gabriel-rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../gabriel-rust -> target

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v5

      - name: Install ffmpeg, bubblewrap, and libclang
        # libclang generates the bindings of Gabriel's shared memory transport.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg bubblewrap libclang-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-c

      - name: Install Gabriel's library
        working-directory: ../gabriel-rust
        run: |
          cargo cinstall --release --locked -p gabriel --library-type staticlib --prefix "$HOME/.local" --libdir lib
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces (required by bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        id: build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Build api/go module
        working-directory: api/go
        run: go build ./...

      - name: Test api/go module
        working-directory: api/go
        run: go test ./...

      - uses: gwatts/go-coverage-action@v2
        id: coverage
        with:
          # Optional coverage threshold
          # use fail-coverage to determine what should happen below this threshold
          coverage-threshold: 80

          # collect coverage for all packages beyond the one under test
          cover-pkg: ./...

          # Ignore code-generated files when calculating coverage totals
          ignore-pattern: |
            \.pb\.go$
            \_string\.go$

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: coverage-report
          path: ${{ steps.coverage.outputs.report-pathname }}

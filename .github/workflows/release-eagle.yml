name: Release eagle and eagled

# Tags are created by `git release` (tools/git/README.md). A root module tag,
# such as v4.1.0 or v4.1.0-alpha.1, publishes eagle and eagled as assets of a
# GitHub release, which tools/install.sh downloads. Alpha and beta tags make
# a prerelease.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          # eagled links liburiel through cgo, so each architecture is built
          # natively, in the manylinux image of its architecture, whose old
          # glibc keeps what the binaries need low. manylinux2014 has glibc
          # 2.17, so eagled runs on Ubuntu 18.04 (glibc 2.27) and newer.
          - arch: amd64
            runner: ubuntu-22.04
            manylinux: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            manylinux: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's JavaScript actions need glibc 2.28, so they can't run in the
      # manylinux2014 image; the build runs in it through docker instead, and
      # sets up Go and liburiel itself.
      - name: Build
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src
          quay.io/pypa/manylinux2014_${{ matrix.manylinux }}
          tools/release/build-eagle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: eagle-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eagle-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum eagle-* eagled-* > SHA256SUMS
          # Prerelease versions, such as v4.1.0-alpha.1, have a hyphen
          flags=
          case $TAG in *-*) flags=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SteelEagle $TAG" --generate-notes $flags ./*

[project]
name = "steele"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "docker>=7.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "GitPython",
    "toml",
    "trogon",
    "python-on-whales"
]

[project.scripts]
steele = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon", "cli", "worker"]

#[tool.hatch.build.targets.editable]
# "compat" mode adds the project root to sys.path via a .pth file,
# rather than using import hooks. Required for uv + hatchling to find
# local packages (cli, daemon, worker) at runtime.
#mode = "compat"

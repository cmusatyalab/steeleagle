# NOTE: options 'vpn' and 'port-base' can only be changed via file edit
# before daemon startup. These fields are inaccessible from the REST API.

# Switch for using Tailscale VPN for the daemon (highly recommended).
vpn = true
# The daemon will bind to the provided port, and will assign vehicle ports
# in ascending order from this base port.
port-base = 9000

[log]
# Whether to log to an MCAP file or not. If false, will only log to the
# console.
mcap = true
# Name of the MCAP file. If not specified or left blank, will be autogenerated
# from the current timestamp. NOTE: do not provide a full filepath, as
# the file will be automatically saved in SteelEagle's application data
# directory.
filename = ""
# Log mask that determines which data is saved to the MCAP file. The topics
# are as follows:
# Console logs -- 0x00000001
# Telemetry    -- 0x00000010
# Imagery      -- 0x00000100
# Results      -- 0x00001000
# To set which data you want to log, bitwise-and the topics and convert
# to an integer value. This will be the bitmask used to discard or save
# incoming data.
mask = 4113 # By default, everything except imagery is saved.
# Level for logging (one of trace, debug, info, warn, error, fatal, panic).
# For more information see https://pkg.go.dev/github.com/rs/zerolog
level = "info"

[errors]
# Specify whether to terminate if error is encountered with setup.
failfast = true

[backend]
[backend.gcs]
[backend.swarm-controller]
[[backend.engines]]
# Name of the package/container to run for this engine.
id = "object-engine"
# How to run this engine (one of sandbox, container, or process):
# sandbox      -- Runs missions inside a sandbox environment (Linux only, 
# requires Bubblewrap).
# container    -- Runs missions inside a container (requires Podman).
# process      -- Runs missions with NO ISOLATION, should only be done for
# trusted code.
isolation = ""
[backend.engines.kwargs]
# NOTE: extra arguments go here

[vehicle]
# Switch for using Tailscale VPN for vehicles (highly recommended).
vpn = true
# How to run missions (one of sandbox, container, or process):
# sandbox      -- Runs missions inside a sandbox environment (Linux only, 
# requires Bubblewrap).
# container    -- Runs missions inside a container (requires Podman).
# process      -- Runs missions with NO ISOLATION, should only be done for
# trusted code.
isolation = ""
[[vehicle.devices]]
# Name of the vehicle.
name = "harpy"
# Name of the package/container to run for this device.
id = "parrot_anafi"
[vehicle.devices.kwargs]
# NOTE: extra arguments go here

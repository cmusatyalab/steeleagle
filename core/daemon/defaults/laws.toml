first = 'ONLINE'

[[states]]
name = 'ONLINE'
allowed = [
    'privileged/**.DaemonService/*',
    'privileged/**.TransferService/*',
    # Proxied calls to vehicles and remote daemons; vehicle laws apply downstream
    'privileged/**',
    'external/**.DaemonService/ListServices',
    'external/**.DaemonService/ListPackages',
    'external/**.DaemonService/GetConfiguration',
    # Allows engines to upload models for other engines
    'external/**.TransferService/TransferModel' ,
    # Remote daemons register with their orchestrator; the handler only lets
    # them register vehicles at their own IP
    'external/**.DaemonService/RegisterOrchestrator',
]
match = []

[[states]]
name = 'LOCKED'
# The orchestrator has AuthCode admin; everyone else is read-only
allowed = [
    'privileged/**.DaemonService/ListServices',
    'privileged/**.DaemonService/ListPackages',
    'privileged/**.DaemonService/GetConfiguration',
    'external/**.DaemonService/ListServices',
    'external/**.DaemonService/ListPackages',
    'external/**.DaemonService/GetConfiguration',
]
match = []

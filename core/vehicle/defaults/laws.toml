first = 'REMOTE'

[[states]]
name = 'REMOTE'
allowed = []
match = [
    ['**.MissionService/StartMission', 'LOCAL'],
]

[[states]]
name = 'LOCAL'
allowed = [
    'user/**.ControlService/*',
    'user/**.DataService/GetTelemetry',
    'user/**.DataService/GetResult',
]
match = [
    ['admin/**.ControlService/*', 'REMOTE'],
    ['admin/**.MissionService/StopMission', 'REMOTE'],
]

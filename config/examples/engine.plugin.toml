[plugin]
# Name of the plugin
name = "YOLO Qualcomm"
# Description of the plugin (optional)
description = "YOLO detection on QNN-enabled hardware"

[[args]] # Plugin arguments (optional)
# Name of the argument
name = "confidence"
# JSON type: (string, object, boolean, array, number)
type = "number"
# Description of the argument (optional)
description = "Confidence threshold (0.01-1.0)"
# Default value (optional)
default = 0.75

[engine]
# Engine type: (detection, classification, guidance, position, generic, filter)
type = "detection"
# Input type, enforced at dataflow creation
input = "steeleagle_protocol/v1/messages/frame/RawFrame"
# Result type, not type enforced
result = "steeleagle_protocol/v1/messages/result/DetectionResult"
[[engine.events]] # Events generated by this engine (optional)
# Label event is given, in addition to the engine name
label = "dropped"
# Event type, not type enforced
type = "steeleagle_protocol/v1/messages/result/GenericResult"

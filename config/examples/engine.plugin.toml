[plugin]
# Name of the plugin
name = "YOLO Qualcomm"
# Plugin type: (driver, engine, monitor, simulator, extra)
type = "engine"
# Description of the plugin (optional)
description = "YOLO detection on QNN-enabled hardware"

[[args]] # Plugin arguments (can be empty)
# Name of the argument
name = "confidence"
# JSON type: (string, object, boolean, array, number)
type = "number"
# Description of the argument (optional)
description = "Confidence threshold (0.01-1.0)"
# Default value (optional)
default = 0.75

[engine]
# Engine type: (detection, classification, guidance, position, generic, filter)
type = "detection"
# Input types, enforced at dataflow creation
inputs = ["steeleagle_protocol/v1/messages/frame/RawFrame"]
# Type sent on along the engine's output edges (optional, defaults to "*"):
# "*" passes each input on as it is, one of its input types passes on only
# that type, and any other type means the engine converts each input into it
# (an encoder or a decoder)
forwards = "*"
# Result type, not type enforced (optional, if left blank this engine is a sink)
result = "steeleagle_protocol/v1/messages/result/DetectionResult"

[[engine.producers]]
# Producer name (advertised as STEELEAGLE_ENGINE_ENDPOINT.<name>; a flow
# names it local.<engine>.<name>)
name = "frames"
# Producer output type
output = "steeleagle_protocol/v1/messages/frame/EncodedFrame"

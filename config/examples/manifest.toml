[info]
# Name of the mission
name = "Patrol and Track"
# Version of the mission
version = "0.1.0"
# Mission roles (optional)
roles = ["Patroller", "Tracker"]
# Mission squawks (optional)
squawks = ["target_found", "done_with_mission"]

[[engines]] # List of engines (can be empty)
# Name of the engine
name = "yolo"
# Type of the result
result = "messages/result/DetectionResult"

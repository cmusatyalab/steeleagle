[plugin]
# Name of the plugin
name = "Logdy"
# Plugin type: (driver, engine, commander, monitor, simulator, extra)
type = "extra"
# Description of the plugin (optional)
description = "Runs the Logdy logging service"
# Extra dependencies not covered by Pixi (optional)
dependencies = ["logdy"]

[[args]] # Plugin arguments (can be empty)
# Name of the argument
name = "timeout"
# JSON type: (string, object, boolean, array, number)
type = "number"
# Description of the argument (optional)
description = "Timeout for disconnection"
# Default value (optional)
default = 1.0

[daemon]
# Daemon default port
port = 9000
# LCS (local compute server) default port
lcs = 9001
# Hostname is optional, but determines how the daemon presents itself if using a
# DNS-enabled VPN like Tailscale
hostname = "eagled"
# Orchestrator is the DNS name or IP address of another daemon in the network
# which is the orchestrator daemon: orchestrator daemons aggregate data and
# vehicles from other daemons to create a centralized control hub (optional)
orchestrator = "homebase:9000"

[[vehicles]] # List of vehicles (can be empty)
# Name of the vehicle
name = "harpy"
# Auth level of the service: (admin, privileged, user, external, unknown)
# (optional, defaults to unknown)
auth = "admin"
[vehicles.plugin] # Driver plugin for this vehicle
# Plugin to use
plugin = "parrot_anafi"
# Package to search in 
package = "github.com/cmusatyalab/steeleagle_plugins/drivers/parrot"
[vehicles.plugin.args] # Args for this plugin (can be empty)
ip = "10.202.0.1"

[[engines]] # List of engines (can be empty)
# Name of the engine
name = "yolo"
# Auth level of the service (optional, defaults to unknown)
auth = "external"
[engines.plugin] # Plugin for this engine
# Plugin to use
plugin = "yolo_qnn"
# Package to search in 
package = "github.com/cmusatyalab/steeleagle_plugins/engines/yolo"
[engines.plugin.args] # Args for this plugin (can be empty)
confidence = 0.0

[[engines]]
name = "gcs"
auth = "privileged"
[engines.plugin]
plugin = "gcs"
package = "github.com/cmusatyalab/steeleagle_plugins/commanders/gcs"
[engines.plugin.args]

# [[monitors]] and [[extras]] follow the same format as [[engines]] (can be empty)

[simulator] # Simulator for this daemon (can be empty)
# Name of the simulator
name = "aviary"
# Auth level of the service (optional, defaults to unknown)
auth = "external"
[simulator.plugin] # Plugin for the simulator
# Plugin to use
plugin = "aviary"
# Package to search in
package = "github.com/cmusatyalab/steeleagle_plugins/simulators/aviary"

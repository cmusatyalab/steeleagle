[daemon]
# Daemon default port
port = 9000
# LCS (local compute server) default port
lcs = 9001
# Hostname is optional, but determines how the daemon presents itself if using a
# DNS-enabled VPN like Tailscale
hostname = "eagled"
# Orchestrator is the DNS name or IP address of another daemon in the network
# which is the orchestrator daemon: orchestrator daemons aggregate data and
# vehicles from other daemons to create a centralized control hub (optional)
orchestrator = "homebase:9000"

[simulator] # Simulator for this daemon (can be empty)
# Package (a git repository where a double slash indicates the
# subdirectory). Versions (a commit SHA, a branch, or a tag) are supported by
# appending them with an `@`, as in Go (optional, defaults to latest)
package = "github.com/cmusatyalab/steeleagle_plugins//simulator"
[[simulator.actors]] # Movable simulator actors
# Tag of the actor
tag = "person"
# Waypoints to travel
waypoints = [
    [40.86543, -79.2831, 0.0],
    [40.86541, -79.2835, 0.0],
]
# Speed to move at (m/s)
speed = 3.0

[[services]] # List of daemon services (can be empty)
# Name of the service (must be unique among services of its type)
name = "harpy"
# Type of the service: (vehicle, engine, extra)
type = "vehicle"
# Auth level of the service: (admin, privileged, user, external, unknown)
# (optional, defaults to unknown)
auth = "admin"
[services.plugin] # Plugin for this service
# Plugin to use
plugin = "parrot_anafi"
# Package (a git repository where a double slash indicates the
# subdirectory, required unless the service is simulated). Versions (a commit
# SHA, a branch, or a tag) are supported by appending them with an `@`, as in
# Go (optional, defaults to latest)
package = "github.com/cmusatyalab/steeleagle_plugins//drivers/parrot@asdef9"
[services.plugin.args] # Args for this plugin (can be empty)
ip = "10.202.0.1"

[[services]]
# Name of the service
name = "yolo"
# Type of the service
type = "engine"
# Auth level of the service (optional, defaults to unknown)
auth = "external"
[services.plugin] # Plugin for this service
# Plugin to use
plugin = "yolo_qnn"
# Package (a git repository where a double slash indicates the
# subdirectory)
package = "github.com/cmusatyalab/steeleagle_plugins//engines/yolo"
# Isolation type (optional, sandbox or container url with tag)
isolate = "sandbox"
[services.plugin.args] # Args for this plugin (can be empty)
confidence = 0.7

[[services]]
# Name of the service
name = "yolo_nq"
# Type of the service
type = "engine"
# Auth level of the service (optional, defaults to unknown)
auth = "external"
[services.plugin] # Plugin for this service
# Plugin to use
plugin = "yolo_qnn"
# Package (a git repository where a double slash indicates the
# subdirectory)
package = "github.com/cmusatyalab/steeleagle_plugins//engines/yolo"
# Isolation type (optional, sandbox or container url with tag)
isolate = "docker.io/library/alpine:latest"
[services.plugin.args] # Args for this plugin (can be empty)

[[services]]
# Name of the service
name = "cassowary"
# Type of the service
type = "vehicle"
# Run the service in the simulator (optional, defaults to false)
simulate = true
[services.plugin] # Plugin from the simulator's package (package and isolate are ignored)
# Plugin to use
plugin = "sim_vehicle"
[services.plugin.args] # Args for this plugin (can be empty)
origin = [40.33862, -79.86521, 0.0]

[[services]]
# Name of the service
name = "yolo_sim"
# Type of the service
type = "engine"
# Run the service in the simulator (optional, defaults to false)
simulate = true
[services.plugin] # Plugin from the simulator's package (package and isolate are ignored)
# Plugin to use
plugin = "sim_detector"
[services.plugin.args] # Args for this plugin (can be empty)

# A flow names its nodes relative to the vehicle that runs it, which qualifies
# each name itself, so the same flow runs on any vehicle:
#   vehicle.<stream>            the vehicle's telemetry, or one of its cameras
#   local.<engine>              an engine on the vehicle's daemon
#   remote.<engine>             an engine on the orchestrator
#   local.<engine>.<producer>   a producer of an engine on the vehicle's daemon
# Producers of remote engines can't be used.

# List of producers in the flow
[[producers]]
# Name of the producer
name = "vehicle.telemetry"
# Inputs the producer may have in the flow at once (optional, at least 1)
tokens = 2

# List of engines in the flow
[[engines]]
# Name of the engine
name = "local.yolo"
# Location of the engine (one of: local, remote), matching its name's prefix
location = "local"

# List of edges in the flow
[[edges]]
# Origin of the edge
from = "vehicle.telemetry"
# Destination of the edge
to = "local.yolo"
# Edge timeout, a positive duration
timeout = "2s"

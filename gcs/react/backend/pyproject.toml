[project]
name = "gcs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-extra-types",
    "zmq",
    "grpcio>=1.74.0",
    "toml",
    "redis",
    "fastapi",
    "uvicorn",
    "steeleagle_sdk",
    "steeleagle-mcp",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "websockets",
    "rich",
    "opencv-python",
    "numpy",
    "colorhash",
]

[tool.uv.sources]
steeleagle_sdk = { path = "../../../sdk", editable = true }
steeleagle-mcp = { path = "../../../mcp", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
]

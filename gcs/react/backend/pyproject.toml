[project]
name = "gcs"
version = "0.4.0"
description = "React/FastAPI Ground Control System for SteelEagle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-extra-types",
    "zmq",
    "grpcio>=1.74.0",
    "toml",
    "redis",
    "fastapi",
    "uvicorn",
    "steeleagle-protocol>=0.3.0",
    "websockets",
    "rich",
    "opencv-python",
    "numpy",
    "colorhash",
    "randomname",
    "requests",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

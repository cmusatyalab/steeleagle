# Mock plugin file for the seed's harpy vehicle (shape of
# config/examples/driver.plugin.toml). Its main camera is named "frames" so
# the Flow Builder's reference flow (harpy.frames) still resolves.

[driver]
type = "copter"

[[driver.cameras]]
name = "frames"
type = "steeleagle_protocol/v1/messages/frame/RawFrame"
description = "Main RGB camera on gimbal"
hres = 1080
vres = 720
hfov = 69
vfov = 43
fps = 30
latency = 280
gimbal = true
primary = true

[[driver.cameras]]
name = "thermal"
type = "steeleagle_protocol/v1/messages/frame/RawFrame"
description = "Thermal camera on gimbal"
hres = 640
vres = 512
fps = 30
gimbal = true
primary = true

[[driver.cameras]]
name = "downward"
type = "steeleagle_protocol/v1/messages/frame/EncodedFrame"
description = "Downward-facing navigation camera"
hres = 640
vres = 480
fps = 15
gimbal = false
primary = false

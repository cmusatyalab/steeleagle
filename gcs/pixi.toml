# Pixi workspace of the GCS plugin. The daemon starts the plugin with
# `pixi run start`, which builds the web UI and the server first; both builds
# are cached, so later starts only rebuild what changed. Run `pixi run build`
# once after installing the package so the first start is quick.
#
# Uriel is linked with cgo, and isn't on conda-forge: its native library must
# be installed where pkg-config finds it (e.g. /usr/local/lib/pkgconfig). Its
# Go module comes from the uriel branch of github.com/cmusatyalab/gabriel (see
# the replace in go.mod); tools/uriel/install.sh builds the matching library.
[workspace]
name = "steeleagle-gcs"
channels = ["conda-forge"]
# Uriel only supports Linux
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# Builds the server; it also compiles missions at runtime, which runs `go build`
go = ">=1.26.5"
# Only needed to build the web UI, which the server serves as static files
nodejs = ">=22"
pkg-config = "*"

[activation.env]
# Uriel's library was built with the system toolchain, so cgo uses it too
CC = "/usr/bin/cc"
CGO_ENABLED = "1"
# The system's pkg-config directories, after the environment's own
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/lib/pkgconfig"

[tasks.web-deps]
cmd = "npm ci --no-audit --no-fund"
cwd = "web"
inputs = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]

# The web UI's local settings (e.g. its Mapbox token), which aren't checked in
[tasks.web-config]
cmd = "test -f src/config.js || cp src/config.js.template src/config.js"
cwd = "web"

[tasks.web-build]
cmd = "npm run build"
cwd = "web"
depends-on = ["web-deps", "web-config"]
inputs = ["web/package.json", "web/index.html", "web/vite.config.js", "web/src/**", "web/public/**"]
outputs = ["web/dist/**"]

[tasks.build]
cmd = "go build -trimpath -o bin/gcs ./cmd/gcs"
depends-on = ["web-build"]
inputs = ["go.mod", "go.sum", "**/*.go"]
outputs = ["bin/gcs"]

# The start task is what the plugin runner invokes; the plugin's args come in
# STEELEAGLE_PLUGIN_ARGS, and its Uriel engine name in ICEORYX_SERVICE
[tasks.start]
cmd = "./bin/gcs -web web/dist"
depends-on = ["build"]

[tasks.test]
cmd = "go test ./..."
depends-on = ["web-build"]

[tasks.web-test]
cmd = "npm test"
cwd = "web"
depends-on = ["web-deps"]

# Serves the web UI with live reload, against a GCS server running on :8080
[tasks.web-dev]
cmd = "npm run dev"
cwd = "web"
depends-on = ["web-deps"]

# Multi-drone configuration file
# This file is shared between local_cli.py and view.py

# Each drone section is defined as [[drones]]
# Required fields:
#   - name: unique identifier for the drone
#   - kernel: gRPC address for control (used by local_cli.py)
#   - imagery: ZMQ address for video stream (used by view.py)

# [[drones]]
# name = "drone0"
# kernel = "unix:///tmp/test0-kernel.sock"
# imagery = "ipc:///tmp/test0-imagery.sock"

# Example with TCP addresses:
# [[drones]]
# name = "remote_drone"
# kernel = "localhost:50051"
# imagery = "tcp://192.168.1.100:5557"

# A list of experiments, run in order. Each is either a mission or a single
# video; for several videos, add an experiment for each. Run only some of them
# with -e <name>, or list them with -l
[[experiments]]
name = "onboard_track" # Unique; names the runs and the daemon configs (below)
vehicle = "" # Vehicle name to target
# Files pushed to every daemon's files directory (STEELEAGLE_FILES,
# ~/.local/share/steeleagle/files) at the start of each trial, with either a
# mission or a video. Each is a file name, or a table to push it under another name
files = [] # e.g. ["labels.json", { file = "model_v2.pt", push_as = "model.pt" }]
# Can set one of mission or video
[experiments.mission]
# If set, will upload and send this mission to start experiment
file = ""
# If true, the mission is not pushed: it is assumed to already be in every
# daemon's missions directory under its own name, and need not be in the
# experiment directory
no_upload = false
# Whether or not to prompt ENTER to start (defaults to true)
auto = false
# If duration > 0, will run the mission for the given duration (in seconds)
# before stopping; otherwise, will prompt the user to press ENTER once done
duration = 0
[experiments.video]
# Video to run for this experiment
video = ""
# Name the video is pushed as, so the driver's video arg can stay fixed across
# experiments (set it to this name). If empty, the video keeps its own name.
push_as = "" # e.g. "video.mp4"
# If true, the video is not pushed: it is assumed to already be in every
# daemon's files directory under its own name, and need not be in the
# experiment directory (but then duration must be set, unless it is there to
# find its length). push_as can't be used with it.
no_upload = false
# The flow to send to start the experiment; required with video
flow = ""
# Whether or not to prompt ENTER to start
auto = false
# If unset, the video runs for its own length (found with ffprobe, or from
# the header of an MP4/MOV file). If set, it overrides that: duration > 0 runs
# the flow for that many seconds; 0 prompts ENTER to stop
# duration = 60
[experiments.netsim]
# Network profiles, in order: normal, limited, degraded, intermittent, denied,
# malicious, delay (unshaped bandwidth, 0-300 ms of variable latency), none
# (no attenuation; netsim isn't run) and ambient (like none, but the link is
# measured with iperf3 first, with the vehicle stopped). "*" runs all of them
profiles = ["*"]
interface = "tailscale0"
port = 9001
# Failpoints for the malicious profile, as [event_time, dead_time] pairs in
# seconds from the start of the run: the port is killed from event_time for
# dead_time seconds. Ignored by every other profile.
failpoints = [] # e.g. [[30, 10], [90, 5]]
trials = 3 # Number of times to run each profile
# Ambient only: the port and duration (s) of the iperf3 measurement. iperf3
# must be installed here and on the vehicle's host, which is reached over ssh
# with its daemon's prefix
# iperf_port = 5201
# iperf_duration = 30
# Extra netsim flags, passed through as is (optional)
# args = ["--direction", "egress", "--seed", "1"]

# A second experiment: everything above can be set again for it
# [[experiments]]
# name = "parking"
# vehicle = "drone"
# [experiments.video]
# video = "parking.mp4"
# push_as = "video.mp4"
# flow = "flow.toml"
# [experiments.netsim]
# profiles = ["normal", "malicious"]
# interface = "tailscale0"
# port = 9001
# failpoints = [[5, 5], [60, 20]]

# Each daemon's config is found by its name and experiment. For each profile,
# <name>_<experiment>_<profile>.toml
# (e.g. fermi_onboard_track_normal.toml) is used if it exists; otherwise the
# config used for the previous profile carries over, or, if there is none yet,
# <name>_<experiment>.toml. If no toml can be found for that experiment, then
# look for a plain <name>.toml.
[daemons]
[daemons.lambda2]
orchestrator = true
prefix = "" # Defaults to empty string for orchestrator (assumed to be local)
[daemons.fermi]
prefix = "root@fermi:" # SSH/RSYNC prefix; ssh prompts on the terminal if needed

[results] # The sources will be destroyed (uses rsync --remove-source-files)
frames_seen = "fermi/root/.local/share/steeleagle/files/seen"
frames_sent = "lambda2/root/.local/share/steeleagle/files/sent"
frames_verified = "lambda2/root/.local/share/steeleagle/files/verified"
[catalogs] # The sources will be copied
mcap = "lambda2/root/.local/share/steeleagle/files/mcap*" # glob matching is supported

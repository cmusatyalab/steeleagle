# No changed_when here: the `creates:` guard already makes this idempotent,
# and the command module reports changed only when it actually executes. An
# unconditional `changed_when: true` would report changed on every run even
# when `creates:` skipped the command entirely.
- name: Install pre-commit via uv
  ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/uv tool install pre-commit"
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/pre-commit"
  become: false

- name: Check whether pre-commit hooks are already installed
  ansible.builtin.stat:
    path: "{{ dev_repo_dest }}/.git/hooks/pre-commit"
  register: dev_precommit_hook  # noqa: var-naming[no-role-prefix]

- name: Install pre-commit git hooks in the repo checkout
  ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/pre-commit install"
  args:
    chdir: "{{ dev_repo_dest }}"
  become: false
  when: dev_clone_repo | bool and not dev_precommit_hook.stat.exists
  changed_when: true

[project]
name = "anafi-blackbox"
version = "0.1.0"
description = "Extract per-frame GPS location and altitude from videos a Parrot Anafi recorded."
requires-python = ">=3.10,<=3.11"
dependencies = [
    "parrot-olympe>=7.7.5,<8.0.0",
]

[project.scripts]
parrot-anafi-blackbox = "anafi_blackbox:main"

[tool.uv]
# parrot-olympe is published only for x86-64 Linux.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

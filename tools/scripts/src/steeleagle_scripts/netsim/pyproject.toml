[project]
name = "netsim"
version = "0.1.0"
description = "Simulate a Weibull-modulated ingress link on one port with tc"
readme = { text = "See the docstring at the top of netsim.py.", content-type = "text/plain" }
requires-python = ">=3.9"
# Standard library only. The script shells out to `tc` and `ip` from iproute2,
# which must be installed on the system (they are not Python packages).
dependencies = []

[project.scripts]
netsim = "netsim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["netsim.py"]

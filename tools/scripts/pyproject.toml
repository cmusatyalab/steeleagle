[project]
name = "steeleagle-scripts"
version = "0.1.0"
description = "Scripts for running experiments on SteelEagle"
readme = "README.md"
authors = [
    { name = "Mihir Bala", email = "mkbala42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "steeleagle-protocol",
]

[project.scripts]
scripts = "steeleagle_scripts.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
steeleagle-protocol = { git = "https://github.com/cmusatyalab/steeleagle", subdirectory = "api/python", tag = "api/python/v0.3.6" }

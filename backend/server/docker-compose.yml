# Environment variables (e.g. ${GABRIEL_IMAGE_TAG}) should
# reside in a .env file along side docker-compose.yaml
# Copy/move template.env -> .env

services:
  # Core Gabriel Server
  # Accepts vehicles' Gabriel clients over QUIC, and serves them the engines
  # listed below. Engines reach it through iceoryx2, so they share its
  # /dev/shm and /tmp/iceoryx2. Vehicles trust its certificate, in
  # ./gabriel-identity/certificate.der: give eagled's [gabriel] table
  # remote-certificate = "$(base64 -w0 gabriel-identity/certificate.der)".
  # GABRIEL_SRC is Gabriel's repository; by default next to steeleagle-go.
  gabriel-server:
    build:
      context: ${GABRIEL_SRC:-../../../gabriel-rust}
      dockerfile: server/Dockerfile
    image: steeleagle-gabriel-server:local
    container_name: gabriel-server
    ports:
      - "4433:4433/udp"
    command: ["--identity-dir", "/identity", "--engine", "telemetry"]
    restart: unless-stopped
    volumes:
      - ./gabriel-identity:/identity
      - gabriel-shm:/dev/shm
      - gabriel-iceoryx2:/tmp/iceoryx2
    networks:
      - steeleagle-net

  # Telemetry Engine
  # Writes telemetry data to Redis and imagery to disk
  telemetry-engine:
    build:
      context: ./engines/telemetry
      additional_contexts:
        gabriel-src: ${GABRIEL_SRC:-../../../gabriel-rust}
        protocol: ../../api/python
    image: steeleagle-telemetry-engine:local
    container_name: telemetry-engine
    restart: on-failure:3
    privileged: true
    command: ["-a", "${REDIS_AUTH}", "-s", "/steeleagle/images"]
    networks:
      - steeleagle-net
      - redis
    volumes:
      - ./steeleagle-vol:/steeleagle/images/
      - gabriel-shm:/dev/shm
      - gabriel-iceoryx2:/tmp/iceoryx2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Obstacle Avoidance Engine
  # Uses Metric3D (or MiDaS) model to estimate depth for vehicles
  obstacle-engine:
    # Uses the old Gabriel, so it can't reach gabriel-server until it is
    # ported. Started only with --profile old-gabriel.
    profiles: ["old-gabriel"]
    image: cmusatyalab/steeleagle-avoidance-engine:${OBSTACLE_IMAGE_TAG}
    container_name: obstacle-engine
    restart: on-failure:3
    privileged: true
    entrypoint: ["uv", "run", "/steeleagle/depth.py", "--model", "${DEPTH_MODEL}", "--threshold", "${DEPTH_THRESHOLD}", "${STORE}", "-a", "${REDIS_AUTH}", "${USE_METRIC3D}"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities:
                - gpu
    volumes:
      - ./steeleagle-vol:/steeleagle/images/
      - ./models:/root/.cache/torch/hub/
    depends_on:
      - gabriel-server
    networks:
      - steeleagle-net
      - redis
    #  - TF_FORCE_GPU_ALLOW_GROWTH=true #the following environment variable may be necessary if your GPU only has a modest (~2GB) amount of RAM
    #  - CUDA_VISIBLE_DEVICES=1 #set this if you want to force CPU only
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Object Detection Engine
  # Performs object detection, returns bounding boxes to vehicles and
  # stores detections in Redis; also optionally performs HSV filtering
  # on detected objects
  object-engine:
    # Uses the old Gabriel, so it can't reach gabriel-server until it is
    # ported. Started only with --profile old-gabriel.
    profiles: ["old-gabriel"]
    image: cmusatyalab/steeleagle-detection-engine:${OBJECT_IMAGE_TAG}
    container_name: object-engine
    restart: on-failure:3
    privileged: true
    entrypoint:
      [
        "uv",
        "run",
        "/steeleagle/obj.py",
        "--model",
        "${DNN}",
        "--threshold",
        "${OBJ_THRESHOLD}",
        "--exclude",
        "${EXCLUSIONS}",
        "${STORE}",
        "-a",
        "${REDIS_AUTH}",
        "-hsv",
        "${HSV_THRESHOLD}",
        "--geofence",
        "${GEOFENCE_FILE}",
        "--ttl",
        "${OBJECT_TTL}",
        "${GEOFENCE_ENABLED}",
        "--radius",
        "${OBJECT_RADIUS}"
      ]
    runtime: nvidia
    volumes:
      - ./models:/steeleagle/model/
      - ./steeleagle-vol:/steeleagle/images/
      - ./geofence:/steeleagle/geofence/
    depends_on:
      - gabriel-server
    networks:
      - steeleagle-net
      - redis
    environment:
      - WEBSERVER=${WEBSERVER_URL}:${HTTP_PORT}
    #  - TF_FORCE_GPU_ALLOW_GROWTH=true #the following environment variable may be necessary if your GPU only has a modest (~2GB) amount of RAM
    #  - CUDA_VISIBLE_DEVICES=-1 #set this if you want to force CPU only
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Swarm Controller
  # Fans out control-plane commands to vehicles over Tailscale.
  swarm-controller:
    image: cmusatyalab/steeleagle-swarm-controller:${SC_IMAGE_TAG}
    container_name: swarm-controller
    restart: unless-stopped
    ports:
      - "5004:5004"
      - "5003:5003"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ./swarm-config.toml:/steeleagle/config.toml:ro
      - ./swarm-controller-state:/steeleagle/.local/share/steeleagle
    networks:
      - steeleagle-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Webserver
  # Hosts vehicles imagery (raw, detections, obstacle avoidance) for GCS
  http-server:
    image: httpd:2.4
    container_name: http-server
    ports:
      - "${HTTP_PORT}:80"
    restart: unless-stopped
    logging:
      driver: none
    networks:
      - steeleagle-net
    volumes:
      - ./steeleagle-vol:/usr/local/apache2/htdocs

  redis:
    image: redis/redis-stack:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped
    privileged: true
    ports:
      - ${REDIS_HOST}:6379:6379
      - ${REDIS_HOST}:8001:8001
    networks:
      - redis
    volumes:
      - ./redis:/data
      - ./redis/redis.conf:/redis-stack.conf

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-targets:/etc/prometheus/targets:ro
    networks:
      - steeleagle-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - steeleagle-net
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PWD}

# Gabriel's shared memory, shared by gabriel-server and its engines. In
# memory, so it is empty after a restart, like a host's /dev/shm. Docker's
# default /dev/shm (64 MB) is too small for frames.
volumes:
  gabriel-shm:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=${GABRIEL_SHM_SIZE:-2g}"
  gabriel-iceoryx2:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  steeleagle-net:
    name: steeleagle-net
    ipam:
      driver: default
      config:
        - subnet: 11.11.0.0/24
  redis:
    ipam:
      driver: default
      config:
        - subnet: 12.12.0.0/24

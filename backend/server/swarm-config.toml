# SwarmService, GCS-facing, over the tailnet
listen-port = 5004
# If true, also bind SwarmService on listen-port as plain TCP outside the
# tailnet.
gcs-plain-listen = true
# RegistryService, eagled-facing
vehicle-port = 5003

[tailscale]
hostname = "swarmcontroller"
# Name of the environment variable holding the tsnet auth key (not the key
# itself). Leave blank to fall back to tsnet's interactive login flow.
authkey-env = "TS_AUTHKEY"

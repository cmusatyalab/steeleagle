# Config for the swarm-controller service in docker-compose.yml.

# SwarmService port
listen-port = 5004
# How SwarmService (client-facing) is bound: "tailnet" (default), "plain",
# or "both" (bind both)
swarm-listen = "both"
# RegistryService port
vehicle-port = 5003
# How RegistryService (vehicle-facing) is bound: "tailnet" (default) or
# "plain"
registry-listen = "tailnet"

[tailscale]
hostname = "swarmcontroller"
# Name of the environment variable holding the tsnet auth key (not the key
# itself). Leave blank to fall back to tsnet's interactive login flow. Create
# the key with any tags already attached in the admin console, so the node
# registers already-tagged instead of being retagged after the fact.
authkey-env = "TS_AUTHKEY"
# Register as an ephemeral node and keep no tsnet state on disk, so a restart
# always re-registers fresh.
ephemeral = true

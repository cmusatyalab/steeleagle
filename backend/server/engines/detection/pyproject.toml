[project]
name = "steeleagle-backend-detection"
version = "1.0.0"
description = "Object detection using YOLOv5 models"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
   "redis",
   "opencv-python-headless",
   "numpy",
   "pykml",
   "pygeodesy",
   "ultralytics==8.4.66",
   "rfdetr>=1.8.3",
   "supervision>=0.29.1",
   "scipy",
   "Pillow",
   "gabriel",
   "steeleagle-protocol",
   "torch",
   # Listed, though ultralytics and rfdetr already require it, so that the
   # torchvision source below applies: uv applies sources only to direct
   # dependencies, and a torchvision from PyPI does not match a CUDA torch.
   "torchvision",
]

[dependency-groups]
dev = [
   "pytest>=8.4.2",
]

[tool.uv]
override-dependencies = [
  "opencv-python ; sys_platform == 'never'",
]

# Gabriel's Python binding loads libgabriel from its repository (cargo build
# --release -p gabriel), so it stays in place, next to steeleagle-go as in
# go.mod. The protocol comes from this repository, so that the engine's
# messages match the vehicle's.
[tool.uv.sources]
gabriel = { path = "../../../../../gabriel-rust/python", editable = true }
steeleagle-protocol = { path = "../../../../api/python", editable = true }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

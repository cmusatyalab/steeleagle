syntax = "proto3";
package steeleagle_protocol.v1.common;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/common;common";

// Angular offsets or poses in 3 dimensions.
message Pose {
  optional float pitch = 1; // pitch [degrees]
  optional float roll = 2; // roll [degrees]
  optional float yaw = 3; // yaw [degrees]
}

// Angular pose velocity in 3 dimensions.
message PoseVelocity {
  optional float pitch_vel = 1; // pitch [degrees/s]
  optional float roll_vel = 2; // roll [degrees/s]
  optional float yaw_vel = 3; // yaw [degrees/s]
}

// Representation of velocity in 3-dimensions.
// Axes are organized as:
// - `x_vel`: forward/northward velocity
// - `y_vel`: right/eastward velocity
// - `z_vel`: up velocity
message Velocity {
  optional float x_vel = 1; // forward/north velocity [meters/s]
  optional float y_vel = 2; // right/east velocity [meters/s]
  optional float z_vel = 3; // up velocity [meters/s]
  optional float angular_vel = 4; // angular velocity [degrees/s]
}

// Representation of global position.
message GlobalPosition {
  optional double latitude = 1;
  optional double longitude = 2;
  optional float altitude = 3;
  optional float heading = 4;
}

// Representation of relative position in 3-dimensions.
// Can represent either a body relative position, e.g. 1m forward, 1m right, 1m up
// or a home relative position, e.g. 1m north, 1m east, 1m up of home position.
// Axes are organized as:
// - `x`: forward offset/north offset
// - `y`: right offset/east offset
// - `z``: up offset
message RelativePosition {
  optional float x = 1; // forward offset/north offset [meters]
  optional float y = 2; // right offset/east offset [meters]
  optional float z = 3; // up offset [meters]
  optional float angle = 4; // angular offset [degrees]
}

// Identifies a vehicle registering as a Gabriel client, made available to
// engines alongside any data it subsequently sends.
message VehicleInfo {
  string vehicle_id = 1; // unique identifier of the vehicle
  string model = 2; // model of the vehicle
}

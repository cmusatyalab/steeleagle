syntax = "proto3";
package steeleagle_protocol.v1.services.swarm;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/swarm;swarm";

/*
 * Registration service for the swarm controller.
 *
 * Used by per-host daemons (eagled) to announce a single vehicle they host to
 * the swarm controller. 
 */
service RegistryService {
  /*
   * Register a vehicle with the swarm controller.
   *
   * eagled calls this once per vehicle, at the moment that vehicle starts. The
   * returned stream is a liveness signal which lives as long as the vehicle is
   * running. If a vehicle connection is broken, eagled will keep attempting to
   * reconnect.
   */
  rpc RegisterVehicle (RegisterVehicleRequest)
    returns (stream RegisterVehicleResponse) {}
}

message RegisterVehicleRequest {
  string daemon_name = 1; // which eagled instance this vehicle belongs to, for disambiguation
  string name = 2;        // vehicle name, matches the name used in SwarmService requests
  uint32 port = 3;        // port this vehicle's server is bound to
}

message RegisterVehicleResponse {} // empty; the call's open stream is the liveness signal

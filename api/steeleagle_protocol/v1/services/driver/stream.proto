syntax = "proto3";
package steeleagle_protocol.v1.services.driver;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/driver;driver";

/*
 * Used to get streams from the driver.
 *
 * This is an internal service used to retrieve imagery and telemetry from the
 * driver. These are processed by the OS and then served as the `DataService`
 * to other plugins. Drivers are expected to publish their streams over Gabriel
 * using a Gabriel producer.
 */
service StreamService {
  /*
   * Start streaming cameras to the vehicle.
   * 
   * Publishes one primary camera and any number of secondary cameras under the
   * given URI to the vehicle using a Gabriel producer.
   */
  rpc StreamCameras (StreamCamerasRequest)
    returns (StreamCamerasResponse) {}

  /*
   * Start streaming telemetry to the vehicle.
   *
   * Publishes telemetry messages to the vehicle using a Gabriel producer under the
   * given URI.
   */
  rpc StreamTelemetry (StreamTelemetryRequest)
    returns (StreamTelemetryResponse) {}
}

// Resolutions that can be requested by the vehicle.
enum Resolution {
  RESOLUTION_UNSPECIFIED = 0; // defaults to 720P
  RESOLUTION_360P = 1;
  RESOLUTION_480P = 2;
  RESOLUTION_720P = 3;
  RESOLUTION_1080P = 4;
  RESOLUTION_4K = 5;
}

// Request for a single camera stream.
message CameraRequest {
  string id = 1;                             // camera ID
  optional uint32 target_fps = 2;            // target fps to stream at, (default: chosen by driver)
  optional Resolution target_resolution = 3; // resolution to stream at, (default: chosen by driver)
  string uri = 4;                            // stream URI to publish at
}

message StreamCamerasRequest {
  CameraRequest primary = 1;              // one primary camera to stream
  repeated CameraRequest secondaries = 2; // any number of secondary cameras to stream
}

message StreamCamerasResponse {}

message StreamTelemetryRequest {
  optional uint32 target_fps = 1; // target fps to stream at, (default: chosen by driver)
  string uri = 2;                 // stream URI to publish at
}

message StreamTelemetryResponse {}

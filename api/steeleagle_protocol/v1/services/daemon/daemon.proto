syntax = "proto3";
package steeleagle_protocol.v1.services.daemon;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/daemon;daemon";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

/*
 * Hosted by eagled as the core SteelEagle daemon service.
 *
 * This service represents eagled's control plane API. Each command interacts
 * with the global state of the daemon. This includes the starting/stopping of
 * plugins and vehicles.
 */
service DaemonService {
  /*
   * Register this daemon as an orchestrator.
   *
   * RegisterOrchestrator is called by other daemons that have set this daemon as
   * their orchestrator. The vehicles on other daemons will be addressable through
   * the daemon gRPC proxy. The stream opens with a handshake: the registering
   * daemon sends its registration, and the orchestrator answers with the remote
   * compute service details and the engines it serves, which become available
   * to the registering daemon's vehicles as remote engines. After that, the
   * stream is a heartbeat: the registering daemon sends empty requests, each
   * answered with an empty response. The registering daemon registers again,
   * with backoff, whenever the stream dies.
   */
  rpc RegisterOrchestrator (stream RegisterOrchestratorRequest)
    returns (stream RegisterOrchestratorResponse) {}

  /*
   * Gets the connection status of this daemon
   *
   * Returns the status of this daemon's connection to its orchestrator daemon.
   */
  rpc GetConnectionStatus (GetConnectionStatusRequest)
    returns (GetConnectionStatusResponse) {}

  /*
   * Load a TOML config.
   *
   * Configures the daemon with a TOML config according to eagled specification.
   * Automatically triggers a daemon restart, and will run all services.
   */
  rpc Configure (ConfigureRequest)
    returns (ConfigureResponse) {}

  /*
   * Gets the current TOML config.
   *
   * Returns the current TOML config as TOML bytes, along with the plugin TOML
   * of each service that was set up.
   */
  rpc GetConfiguration (GetConfigurationRequest)
    returns (GetConfigurationResponse) {}

  /*
   * List active services.
   *
   * List services lists all daemon services from the config, whether they are
   * running or stopped, along with why each couldn't be set up, failed to
   * start, or exited, if it did. On an orchestrator, the services of every
   * registered remote daemon are listed too. Services are named by their
   * qualified names, "{daemon IP}.{name}", so they are unique across daemons;
   * a remote daemon that can't be reached is left out, and listed as
   * unavailable.
   */
  rpc ListServices (ListServicesRequest)
    returns (ListServicesResponse) {}

  /*
   * Restart a daemon services.
   *
   * Restarts a target daemon service.
   */
  rpc RestartService (RestartServiceRequest)
    returns (RestartServiceResponse) {}

  /*
   * Restart the daemon.
   *
   * Restarts the whole daemon and all of its services, including core services
   * that have died. The config is reloaded and pending package changes are
   * applied, like after a `Configure` call.
   */
  rpc Restart (RestartRequest)
    returns (RestartResponse) {}

  /*
   * Install a package.
   *
   * Installs a new package locally. A package can host several plugins which
   * are indexed and available for future `Configure` calls.
   */
  rpc InstallPackage (InstallPackageRequest)
    returns (InstallPackageResponse) {}

  /*
   * List packages.
   *
   * Lists all locally installed packages.
   */
  rpc ListPackages (ListPackagesRequest)
    returns (ListPackagesResponse) {}

  /*
   * Remove a package.
   *
   * Removes a package identified by its `url`.
   */
  rpc RemovePackage (RemovePackageRequest)
    returns (RemovePackageResponse) {}
}

// Types of daemon services.
enum ServiceCategory {
  SERVICE_CATEGORY_UNSPECIFIED = 0; // unspecified (returns an error)
  SERVICE_CATEGORY_SIMULATOR = 1;   // simulator service
  SERVICE_CATEGORY_VEHICLE = 2;     // vehicle service
  SERVICE_CATEGORY_ENGINE = 3;      // engine service
  SERVICE_CATEGORY_EXTRA = 4;       // extra service
}

// Types of isolation for a plugin.
enum Isolation {
  ISOLATION_UNSPECIFIED = 0; // unspecified
  ISOLATION_PROCESS = 1;     // process
  ISOLATION_SANDBOX = 2;     // sandbox
  ISOLATION_CONTAINER = 3;   // container
}

// A service in the system.
message Service {
  string name = 1;                     // service description
  ServiceCategory category = 2;        // service category
  string plugin = 3;                   // plugin name
  string uri = 4;                      // package uri
  bytes config = 5;                    // plugin config
  Isolation isolation = 6;             // isolation of the plugin 
  bool running = 7;                    // whether or not the service is running
  string auth = 8;                     // auth level of this service
}

// An unavailable daemon.
message Unavailable {
  string ip = 1;        // IP address
  string hostname = 2;  // hostname
  string reason = 3;    // reason for unavailability
}

message RegisterOrchestratorRequest {
  repeated Service services = 1; // services of the daemon registering
  string hostname = 2;           // hostname of the daemon registering
  int32 port = 3;                // port of the daemon registering
  string arch = 4;               // architecture of the daemon registering (goarch string)
  string os = 5;                 // operating system of the daemon registering (goos string)
}

message RegisterOrchestratorResponse {
  repeated Service services = 1; // services of the orchestrator
  string hostname = 2;           // hostname of the orchestrator
  bytes cert = 3;                // DER cert of the orchestrator's local compute service
  int32 lcs_port = 4;            // port of the orchestrator's local compute service
}

message GetConnectionStatusRequest {}

message GetConnectionStatusResponse {
  bool connected = 1; // whether or not the daemon is connected
}

message ConfigureRequest {
  string config_toml = 1; // eagled config.toml
}

message ConfigureResponse {}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  bytes config_toml = 1; // eagled config.toml
}

message ListServicesRequest {}

message ListServicesResponse {
  // services on the daemon (merged services on orchestrator)
  repeated Service services = 1;
  // remote daemons that were unavailable (orchestrator only)
  repeated Unavailable unavailable = 2;
}

message RestartServiceRequest {
  string service_names = 1; // target service
}

message RestartServiceResponse {}

message RestartRequest {}

message RestartResponse {}

message InstallPackageRequest {
  string uri = 1; // package uri 
}

message InstallPackageResponse {}

// Package installed on the daemon.
message Package {
  string uri = 1;                         // package uri
  map<string, bytes> plugins = 2;         // plugin tomls in this package 
  google.protobuf.Timestamp modified = 3; // last modified time
}

message ListPackagesRequest {}

message ListPackagesResponse {
  repeated Package packages = 1; // installed packages
}

message RemovePackageRequest {
  string uri = 1; // package uri
}

message RemovePackageResponse {}

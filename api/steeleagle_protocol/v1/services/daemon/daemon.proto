syntax = "proto3";
package steeleagle_protocol.v1.services.daemon;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/daemon;daemon";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

/*
 * Hosted by eagled as the core SteelEagle daemon service.
 *
 * This service represents eagled's control plane API. Each command interacts
 * with the global state of the daemon. This includes the starting/stopping of
 * plugins and vehicles.
 */
service DaemonService {
  /*
   * Register this daemon as an orchestrator.
   *
   * RegisterOrchestrator is called by other daemons that have set this daemon as
   * their orchestrator. The vehicles on other daemons will be addressable through
   * the daemon gRPC proxy.
   */
  rpc RegisterOrchestrator (RegisterOrchestratorRequest)
    returns (RegisterOrchestratorResponse) {}

  /*
   * Load a TOML config.
   *
   * Configures the daemon with a TOML config according to eagled specification.
   * Automatically triggers a daemon restart, and will run all services.
   */
  rpc Configure (ConfigureRequest)
    returns (ConfigureResponse) {}

  /*
   * Gets the current TOML config.
   *
   * Returns the current TOML config as TOML bytes. 
   */
  rpc GetConfiguration (GetConfigurationRequest)
    returns (GetConfigurationResponse) {}

  /*
   * Resets the current TOML config.
   *
   * Deletes the current TOML config and replaces it with the default config
   * (base backend services, but no vehicles or engines).
   */
  rpc ResetConfiguration (ResetConfigurationRequest)
    returns (ResetConfigurationResponse) {}

  /*
   * List active services.
   *
   * List services lists all active daemon services, whether they are running or
   * stopped, and their cap files, if applicable.
   */
  rpc ListServices (ListServicesRequest)
    returns (ListServicesResponse) {}

  /*
   * Restart daemon services.
   *
   * Restarts a list of daemon services. These must be vehicles, monitors, or
   * engines. Restarts of other services, like GCS or simulator, must be done
   * through a `Configure` call and will return an error if included.
   */
  rpc RestartServices (RestartServicesRequest)
    returns (RestartServicesResponse) {}

  /*
   * Install a package.
   *
   * Installs a new package locally. A package can host several plugins which
   * are indexed and available for future `Configure` calls.
   */
  rpc InstallPackage (InstallPackageRequest)
    returns (InstallPackageResponse) {}

  /*
   * List packages.
   *
   * Lists all locally installed packages.
   */
  rpc ListPackages (ListPackagesRequest)
    returns (ListPackagesResponse) {}

  /*
   * Remove a package.
   *
   * Removes a package identified by its `url`.
   */
  rpc RemovePackage (RemovePackageRequest)
    returns (RemovePackageResponse) {}
}

message RegisterOrchestratorRequest {
  repeated string vehicles = 1; // vehicle names
}

message RegisterOrchestratorResponse {
  string cert = 1; // cert key for the remote compute service
  int32 port = 2;  // port for the remote compute service
}

message ConfigureRequest {
  string config_toml = 1; // eagled config.toml
}

message ConfigureResponse {}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  bytes config_toml = 1;               // eagled config.toml
  map<string, bytes> plugin_tomls = 2; // plugin toml mapping (service name -> plugin toml bytes)
}

// Types of daemon services.
enum ServiceCategory {
  SERVICE_CATEGORY_UNSPECIFIED = 0; // unspecified (returns an error)
  SERVICE_CATEGORY_VEHICLE = 1;     // vehicle service
  SERVICE_CATEGORY_ENGINE = 2;      // engine service
  SERVICE_CATEGORY_MONITOR = 3;     // monitor service
  SERVICE_CATEGORY_COMMANDER = 4;   // commander service
  SERVICE_CATEGORY_SIMULATOR = 5;   // simulator service
  SERVICE_CATEGORY_EXTRA = 6;       // extra service
}

// A service description.
message Service {
  string name = 1;                  // service name
  ServiceCategory category = 2;     // service category
}

// An active service in the system.
message ActiveService {
  Service srv = 1;                     // service description
  string plugin = 2;                   // plugin name
  string url = 3;                      // package url
  bool running = 4;                    // whether or not the service is running
  google.protobuf.Duration uptime = 5; // service uptime
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated ActiveService services = 1; // list of active services
}

message RestartServicesRequest {
  repeated Service services = 1; // list of target services
}

message RestartServicesResponse {}

message InstallPackageRequest {
  string url = 1;               // package url 
  optional string tag = 2;      // branch or commit tag
}

message InstallPackageResponse {}

// Package installed on the daemon
message Package {
  string url = 1;                           // package url
  string tag = 2;                           // branch or commit tag
  map<string, ServiceCategory> plugins = 3; // plugins in this package 
  google.protobuf.Timestamp installed = 4;  // install time
}

message ListPackagesRequest {}

message ListPackagesResponse {
}

message RemovePackageRequest {
  string url = 1;   // package url
}

message RemovePackageResponse {}

message ResetConfigurationRequest {}

message ResetConfigurationResponse {}

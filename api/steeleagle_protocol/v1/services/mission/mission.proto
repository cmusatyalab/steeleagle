syntax = "proto3";
package steeleagle_protocol.v1.services.mission;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/mission;mission";

/*
 * Used to start a new mission or stop an active mission.
 *
 * This service is hosted by the driver module and represents the
 * mission interface for the vehicle. While a single vehicle will
 * return an OK message as soon as a command is acked and sent,
 * multiple vehicles will return a message stream when proxied.
 */
service MissionService {
  /*
   * Order a vehicle to start its mission.
   *
   * Causes the vehicle to start its uploaded mission. This will enable autonomous
   * control mode, which can be interrupted by sending a `StopMission` or
   * `SwarmHold`.
   */
  rpc StartMission (StartMissionRequest)
	returns (StartMissionResponse) {}
  /*
   * Upload a mission to a vehicle
   *
   * Streams a mission binary to a vehicle. The first message must carry a
   * `header`; every later message carries a `chunk`. The upload is committed
   * only if the byte count and SHA-256 match the header. Can be started by
   * sending a subsequent `StartMission` command.
   */
  rpc UploadMission (stream UploadMissionRequest)
	returns (UploadMissionResponse) {}
  /*
   * Order a vehicle to stop its mission.
   *
   * Causes the vehicle to stop its running mission. This will enable manual
   * control mode.
   */
  rpc StopMission (StopMissionRequest)
	returns (StopMissionResponse) {}
  /*
   * Report what this mission service can run
   *
   * Lets an uploader pick the right binary variant before sending any bytes.
   */
  rpc GetMissionInfo (GetMissionInfoRequest)
	returns (GetMissionInfoResponse) {}
}

// Describes the mission binary that follows in an upload stream.
message MissionHeader {
  string arch = 1; // GOARCH-style architecture: "amd64" | "arm64"
  uint64 size = 2; // exact byte length of the binary
  bytes sha256 = 3; // 32-byte SHA-256 digest of the binary
}

message UploadMissionRequest {
  oneof part {
    MissionHeader header = 1; // first message only
    bytes chunk = 2; // every later message
  }
}

message UploadMissionResponse {}

message GetMissionInfoRequest {}

message GetMissionInfoResponse {
  string arch = 1; // GOARCH of the host the mission service runs on
}

message StartMissionRequest {}

message StartMissionResponse {}

message StopMissionRequest {}

message StopMissionResponse {}

syntax = "proto3";
package steeleagle_protocol.v1.services.eagled;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/eagled;eagled";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

/*
 * Hosted by eagled as the core SteelEagle daemon service.
 *
 * This service represents eagled's control plane API. Each command interacts
 * with the global state of the daemon. This includes the starting/stopping of
 * plugins and vehicles.
 */
service DaemonService {
  /*
   * Load a TOML config.
   *
   * Configures the daemon with a TOML config according to eagled specification.
   * Automatically triggers a daemon restart, and will run all services. If 
   * `auto_install` is set to `true`, any unknown plugins will be installed on
   * their latest branch version.
   */
  rpc Configure (ConfigureRequest)
    returns (ConfigureResponse) {}

  /*
   * Gets the current TOML config.
   *
   * Returns the current TOML config as TOML bytes. 
   */
  rpc GetConfiguration (GetConfigurationRequest)
    returns (GetConfigurationResponse) {}

  /*
   * Resets the current TOML config.
   *
   * Deletes the current TOML config and replaces it with the default config
   * (base backend services, but no vehicles or engines).
   */
  rpc ResetConfiguration (ResetConfigurationRequest)
    returns (ResetConfigurationResponse) {}

  /*
   * Restart daemon services.
   *
   * Restarts a list of daemon services. These must be vehicles, monitors, or
   * engines. Restarts of other services, like GCS or simulator, must be done
   * through a `Configure` call.
   */
  rpc RestartServices (RestartServicesRequest)
    returns (RestartServicesResponse) {}

  /*
   * Install a plugin.
   *
   * Installs a new plugin for a given service locally. Upon success, this
   * plugin is available for service. Future `Configure` calls can refer to
   * this plugin by `url` or by an optionally provided `nickname` which must
   * be locally unique.
   */
  rpc InstallPlugin (InstallPluginRequest)
    returns (InstallPluginResponse) {}

  /*
   * Remove a plugin.
   *
   * Removes a plugin identified by its `url` or `nickname`.
   */
  rpc RemovePlugin (RemovePluginRequest)
    returns (RemovePluginResponse) {}
}

message ConfigureRequest {
  string config_toml = 1; // eagled config.toml
}

message ConfigureResponse {}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  bytes config_toml = 1; // eagled config.toml
}

enum ServiceCategory {
  SERVICE_CATEGORY_UNSPECIFIED = 0; // unspecified (returns an error)
  SERVICE_CATEGORY_VEHICLE = 1;     // vehicle service
  SERVICE_CATEGORY_ENGINE = 2;      // engine service
  SERVICE_CATEGORY_MONITOR = 3;     // monitor service
  SERVICE_CATEGORY_EXTRA = 4;       // extra service
}

message ServiceRequest {
  string name = 1;              // name of the service
  ServiceCategory category = 3; // service category
}

message RestartServicesRequest {
  repeated ServiceRequest services = 1; // list of target services
}

message RestartServicesResponse {}

message InstallPluginRequest {
  optional string nickname = 1; // plugin nickname (default: to path base of url)
  string url = 2;               // url to pull the plugin from 
  optional string tag = 3;      // branch or commit tag
  ServiceCategory category = 4; // service category
}

message InstallPluginResponse {}

message RemovePluginRequest {
  string nickname = 1;          // plugin nickname
  ServiceCategory category = 5; // service category
}

message RemovePluginResponse {}

message RestartRequest {}

message RestartResponse {}

message ResetConfigurationRequest {}

message ResetConfigurationResponse {}

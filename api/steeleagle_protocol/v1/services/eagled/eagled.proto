syntax = "proto3";
package steeleagle_protocol.v1.services.eagled;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/eagled;eagled";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

/*
 * Hosted by eagled as the core SteelEagle daemon service.
 *
 * This service represents eagled's control plane API. Each command interacts
 * with the global state of the daemon. This includes the starting/stopping of
 * plugins and vehicles.
 */
service DaemonService {
  /*
   * Load a TOML configuration document.
   *
   * Configures the daemon with a TOML config according to eagled specification.
   * Can be configured in auto-start mode, where eagled will try to start everything
   * immediately. Can also be configured to install plugins that don't already exist.
   */
  rpc Configure (ConfigureRequest)
    returns (ConfigureResponse) {}

  rpc StartServices (StartServicesRequest)
    returns (StartServicesResponse) {}

  rpc StopServices (StopServicesRequest)
    returns (StopServicesResponse) {}

  rpc ListServices (ListServicesRequest)
    returns (ListServicesResponse) {}

  rpc InstallPlugin (InstallPluginRequest)
    returns (InstallPluginResponse) {}

  rpc RemovePlugin (RemovePluginRequest)
    returns (RemovePluginResponse) {}

  rpc Restart (RestartRequest)
    returns (RestartResponse) {}

  rpc ResetConfiguration (ResetConfigurationRequest)
    returns (ResetConfigurationResponse) {}
  
  rpc StreamLogs (StreamLogsRequest)
    returns (stream StreamLogsResponse) {}

  rpc ListLogSources (ListLogSourcesRequest)
    returns (stream ListLogSourcesResponse) {}
}

message ConfigureRequest {
  string config_toml = 1; // eagled config.toml
}

message ConfigureResponse {}

enum ServiceCategory {
  SERVICE_CATEGORY_UNSPECIFIED = 0;
  SERVICE_CATEGORY_VEHICLE = 1;
  SERVICE_CATEGORY_ENGINE = 2;
  SERVICE_CATEGORY_MONITOR = 3;
  SERVICE_CATEGORY_EXTRA = 4;
}

message ServiceRequest {
  string short_name = 1;
  optional string url = 2;
  ServiceCategory category = 3;
}

message StartServicesRequest {
  repeated ServiceRequest services = 1;
}

message StartServicesResponse {}

message StopServicesRequest {
  repeated ServiceRequest services = 1;
}

message StopServicesResponse {}

message AvailableService {
  string short_name = 1;
  string url = 2;
  string tag = 3;
  ServiceCategory category = 4;
  bool running = 5;
  google.protobuf.Duration uptime = 6; 
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated AvailableService services = 1;
}

message InstallPluginRequest {
  string url = 1;  
  optional string tag = 2;  
  ServiceCategory category = 3;
}

message InstallPluginResponse {}

message RemovePluginRequest {
  string short_name = 1;
  optional string url = 2;
  ServiceCategory category = 5;
}

message RemovePluginResponse {}

message RestartRequest {}

message RestartResponse {}

message ResetConfigurationRequest {}

message ResetConfigurationResponse {}

message StreamLogsRequest {
  repeated string sources = 1;        // empty = all sources
  int32 tail = 2;                     // backlog lines per source before following; 0 = none
  bool follow = 3;                    // false: send backlog and end; true: keep streaming
  map<string, uint64> after_seq = 4;  // resume cursor: only records with seq > value
}

message StreamLogsResponse {
  string source = 1;
  uint64 seq = 2;                     // monotonic per source, 0 on gap markers
  google.protobuf.Timestamp time = 3; // daemon receive time
  string level = 4;                   // empty if unknown
  string text = 5;                    // log text
  uint64 dropped = 6;                 // nonzero marks dropped logs
}

// Log source file.
message LogSource {
  string name = 1;      // source file name
  bool running = 2;     // a live process is currently producing it
  int64 size_bytes = 3; // total bytes on disk across rotated files
}

message ListLogSourcesRequest {}

message ListLogSourcesResponse {
  repeated LogSource sources = 1; // list of all source
}

syntax = "proto3";
package steeleagle_protocol.v1.services.vehicle;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/vehicle;vehicle";

import "google/protobuf/timestamp.proto";
import "steeleagle_protocol/v1/messages/result/result.proto";
import "steeleagle_protocol/v1/messages/telemetry/telemetry.proto";

/*
 * Used to configure Gabriel flows for sensor streams.
 *
 * This service is used to configure the current Gabriel flow. Gabriel flows describe
 * how data from sensor streams move between cognitive engines. Each flow creates a 
 * result, which can be accessed here.
 */
service DataService {
  /*
   * Set the current flow.
   *
   * Parses and executes the current flow from TOML bytes, replacing the
   * vehicle's current dataflow; setting the current dataflow again does
   * nothing. A mission may set the dataflow while the vehicle is in mission
   * (user) mode, and the dataflow is not restored when it exits mission mode;
   * setting it back is the responsibility of whoever needs another one.
   */
  rpc SetDataflow (SetDataflowRequest)
	returns (SetDataflowResponse) {}

  /*
   * Get the current flow.
   *
   * Returns the TOML bytes of the current dataflow, as they were given to
   * `SetDataflow`, or empty bytes if no dataflow is set.
   */
  rpc GetFlow (GetFlowRequest)
    returns (GetFlowResponse) {}

  /*
   * Query a dataflow.
   *
   * Queries a dataflow for results, returning all results that match the query
   * timestamps. If no start timestamp or end timestamp is provided, this will
   * return the most recent result for that dataflow.
   */
  rpc GetResult (GetResultRequest)
    returns (GetResultResponse) {}

  /*
   * Query telemetry data.
   *
   * Queries telemetry, returning all received telemetry that match the query
   * timestamps. If no start timestamp or end timestamp is provided, this will
   * return the most recent received telemetry.
   */
  rpc GetTelemetry (GetTelemetryRequest)
    returns (GetTelemetryResponse) {}
}

message SetDataflowRequest {
  bytes toml = 1;  // dataflow TOML bytes according to Gabriel specifications
}

message SetDataflowResponse {}

message GetFlowRequest {}

message GetFlowResponse {
  bytes toml = 1;  // current dataflow TOML bytes, empty if no dataflow is set
}

message GetResultRequest {
  string engine = 1;                                 // name of the engine to query
  optional google.protobuf.Timestamp time_start = 2; // start time of the query 
  optional google.protobuf.Timestamp time_end = 3;   // end time of the query 
}

message GetResultResponse {
  repeated steeleagle_protocol.v1.messages.result.ComputeResult result = 1; // result query response
}

message GetTelemetryRequest {
  optional google.protobuf.Timestamp time_start = 1; // start time of the query 
  optional google.protobuf.Timestamp time_end = 2;   // end time of the query 
}

message GetTelemetryResponse {
  repeated steeleagle_protocol.v1.messages.telemetry.Telemetry telemetry = 1; // telemetry query response
}

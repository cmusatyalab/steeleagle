syntax = "proto3";
package steeleagle_protocol.v1.services.vehicle;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/services/vehicle;vehicle";

/*
 * Used to configure compute engines for sensor streams.
 *
 * This service is used to configure engine endpoints for frames and telemetry
 * post-processing. It maintains an internal consumer list of engines that the
 * vehicle broadcasts frames and telemetry to. RPC methods within this service
 * allow for manipulation of this list.
 */
service ComputeService {
  /*
   * Set the datasink consumer list.
   *
   * Takes a list of datasinks and replaces the current consumer list with them.
   */
  rpc SetEnginesForTopic (SetEnginesForTopicRequest)
	returns (SetEnginesForTopicResponse);
}

// Denotes where an engine is located.
enum EngineLocation {
  ENGINE_LOCATION_UNSPECIFIED = 0; // send to all available locations
  ENGINE_LOCATION_BOTH = 1; // send to both
  ENGINE_LOCATION_REMOTE = 2; // remote location only (network hop required)
  ENGINE_LOCATION_LOCAL = 3; // local location only (IPC)
}

// Denotes which type of data to forward.
enum Topic {
  TOPIC_UNSPECIFIED = 0; // defaults to all topics
  TOPIC_TELEMETRY = 1; // telemetry from the driver
  TOPIC_FRAMES = 2; // video frames from the driver
}

// Information about an engine.
message EngineInfo {
  // engine ID
  string id = 1;
  // engine location
  EngineLocation location = 2;
}

message SetEnginesForTopicRequest {
  Topic topic = 1; // topic to forward
  repeated EngineInfo datasinks = 2; // name of target engines
}

message SetEnginesForTopicResponse {}

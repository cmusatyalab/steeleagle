syntax = "proto3";
package steeleagle_protocol.v1.messages.result;

option go_package = "github.com/cmusatyalab/steeleagle/api/go/steeleagle_protocol/v1/messages/result;result";

import "steeleagle_protocol/v1/common/common.proto";
import "google/protobuf/timestamp.proto";

/*
 * Bounding box associated with an object detection.
 *
 * Defines the upper left and lower right corners of a detected object
 * in an image frame. Origin (0,0) is the top left corner of the input image.
 * (image_height, image_width) is the bottom right corner.
 */
message BoundingBox {
  double y_min = 1; // minimum y offset percentage with respect to image size [0.0-1.0]
  double x_min = 2; // minimum x offset percentage with respect to image size [0.0-1.0]
  double y_max = 3; // maximum y offset percentage with respect to image size [0.0-1.0]
  double x_max = 4; // maximum x offset percentage with respect to image size [0.0-1.0]
}

// Object detection generated by a model.
message Detection {
  string class_name = 1; // class name of detection
  double score = 2; // confidence score
  BoundingBox bbox = 3; // bounding box
}

// List of object detections.
message DetectionResult {
  repeated Detection detections = 1; // list of detections
}

// Classification result generated by a classifier model.
message ClassificationResult {
  double score = 1; // classification score
}

// Avoidance result generated by an avoidance model.
message GuidanceResult {
  common.Velocity trajectory = 1; // actuation vector towards safe area
}

// Position result generated by a SLAM/position estimator model.
message PositionResult {
  oneof position { // estimated position
    common.RelativePosition relative_position = 1;
    common.GlobalPosition global_position = 2;
  }
}

// Generic result.
message GenericResult {
  bytes payload = 1; // generic payload
}

// Compute result generated by a compute server.
message ComputeResult {
  google.protobuf.Timestamp timestamp = 1; // inference timestamp
  oneof type { // type of detection
    DetectionResult detection_result = 2; // object detection
    ClassificationResult classification_result = 3; // classification
    GuidanceResult guidance_result = 4; // guidance directive
    PositionResult position_result = 5; // position estimate
    GenericResult generic_result = 6; // generic result
  }
}

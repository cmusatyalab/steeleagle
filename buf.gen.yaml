version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/cmusatyalab/steeleagle/tree/vehicle-go/protocol/bindings/go/
plugins:
  - remote: buf.build/protocolbuffers/go
    out: protocol/bindings/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: protocol/bindings/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python
    out: protocol/bindings/python
  - remote: buf.build/grpc/python
    out: protocol/bindings/python
inputs:
  - directory: protocol/defs

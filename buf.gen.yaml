version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/cmusatyalab/steeleagle/api/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: api/go
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local: [go, run, ./sdk/protoc_plugin]
    out: sdk/
    strategy: all
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - remote: buf.build/grpc/go:v1.6.2
    out: api/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.0
    out: api/python/src
  - remote: buf.build/protocolbuffers/pyi:v36.0
    out: api/python/src
  - remote: buf.build/grpc/python:v1.83.0
    out: api/python/src
inputs:
  - directory: api
